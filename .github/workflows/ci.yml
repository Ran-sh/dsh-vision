name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + integration + boundary tests (offline, keyless)
        run: npm test

  install-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build artifacts (package/built tests require them)
        run: npm run build
      - name: Package integrity (metadata, closure, npm pack content)
        run: npm run test:package
      - name: Built-artifact verification (embedded visual fixtures, RPC exports)
        run: npm run test:built

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Package integrity (Windows npm pack)
        run: npm run test:package

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for credentials and secrets
        run: |
          set -e
          # Never commit credential documents or dotenv files.
          if git ls-files | grep -E '(^|/)\.credentials\.ya?ml$|(^|/)\.env$'; then
            echo "credential/dotenv file committed" >&2
            exit 1
          fi
          # Real API key patterns (sk-...) outside test fixtures.
          if git grep -nE 'sk-[A-Za-z0-9]{16,}' -- ':!*.test.ts' ':!tests/**' ':!**/tests/**' | grep -v 'sk-test' ; then
            echo "possible API key committed" >&2
            exit 1
          fi
          # Provider vocabulary must stay out of the vision service package.
          if git grep -nE 'chat-completions|responses|OpenAI|apiKey|Authorization|Bearer|baseURL' -- packages/vision/src; then
            echo "provider vocabulary leaked into packages/vision/src" >&2
            exit 1
          fi
